<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Prices</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
        <h1>Game Prices</h1>
    </header>

    <main>
        <button id="update-btn">Update data</button>
        <div id="cards">
            <div class="card">
                <p class="game-name">
                    Astro Bot
                </p>
                <img src="https://image.api.playstation.com/vulcan/ap/rnd/202406/0500/8f15268257b878597757fcc5f2c9545840867bc71fc863b1.png" alt="">
                <p class="normal-price">299.90</p>
                <p class="current-price">299.90</p>
            </div>
            <div class="card">
                <p class="game-name">
                    Ghost of Tsushima
                </p>
                <img src="https://upload.wikimedia.org/wikipedia/pt/d/dc/Ghost_of_Tsushima_capa.png" alt="">
                <p class="normal-price marked">299.90</p>
                <p class="current-price">149.90</p>
            </div>
        </div>
    </main>
    
</body>
</html>
